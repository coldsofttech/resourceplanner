{% extends "users/auth_base.html" %}
{% block title %}Check Your Email — Resource Planner{% endblock %}

{% block auth_content %}
<div class="rp-auth-icon-wrap">
    <i class="bi bi-envelope-check rp-auth-icon"></i>
</div>
<h1 class="rp-auth-title">Check your email</h1>
<p class="rp-auth-subtitle">
    If an account exists for that address, you'll receive a password reset link shortly.
</p>
<p class="rp-auth-footer">
    <a href="/login/" class="rp-auth-link"><i class="bi bi-arrow-left me-1"></i>Back to sign in</a>
</p>
{% endblock %}
