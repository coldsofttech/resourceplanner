<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Submit Project Demand{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    {% load static %}
    <link href="{% static 'css/main.css' %}" rel="stylesheet" />
    <style>
        body { background: var(--rp-bg, #f8f9fa); font-family: 'DM Sans', sans-serif; }
        .ob-wrap { min-height: 100vh; padding: 2rem 1rem; display: flex; align-items: flex-start; justify-content: center; }
        .ob-card { background: var(--rp-surface, #fff); border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 2rem 2.5rem; width: 100%; max-width: 760px; }
        .ob-brand { display: flex; align-items: center; gap: .5rem; text-decoration: none; color: var(--rp-primary, #4f46e5); font-weight: 700; font-size: 1.1rem; margin-bottom: 1.5rem; }
        .ob-brand i { font-size: 1.5rem; }
        .ob-title { font-size: 1.5rem; font-weight: 600; margin-bottom: .25rem; }
        .ob-subtitle { color: var(--rp-text-muted, #6b7280); margin-bottom: 1.75rem; font-size: .95rem; }
        @media (max-width: 576px) { .ob-card { padding: 1.5rem 1rem; } }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="ob-wrap">
<div class="ob-card">
    <a class="ob-brand" href="/">
        <i class="bi bi-diagram-3-fill"></i>
        <span>Resource<strong>Planner</strong></span>
    </a>
    <h1 class="ob-title">Submit a Project Demand</h1>
    <p class="ob-subtitle">Fill in the details below and our team will review your request.</p>
    {% block content %}{% endblock %}
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
