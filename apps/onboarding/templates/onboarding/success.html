<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demand Submitted — ResourcePlanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    {% load static %}
    <link href="{% static 'css/main.css' %}" rel="stylesheet" />
    <style>
        body { background: var(--rp-bg, #f8f9fa); font-family: 'DM Sans', sans-serif; }
        .ob-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
        .ob-card { background: var(--rp-surface, #fff); border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 3rem 2.5rem; width: 100%; max-width: 520px; text-align: center; }
        .ob-brand { display: flex; align-items: center; justify-content: center; gap: .5rem; text-decoration: none; color: var(--rp-primary, #4f46e5); font-weight: 700; font-size: 1.1rem; margin-bottom: 2rem; }
        .ob-brand i { font-size: 1.5rem; }
        .success-icon { font-size: 3.5rem; color: #22c55e; margin-bottom: 1.25rem; }
        .ob-title { font-size: 1.5rem; font-weight: 600; margin-bottom: .5rem; }
        .ob-body { color: var(--rp-text-muted, #6b7280); margin-bottom: 2rem; font-size: .95rem; line-height: 1.6; }
        .ob-project { font-weight: 600; color: var(--rp-text, #111827); }
    </style>
</head>
<body>
<div class="ob-wrap">
<div class="ob-card">
    <a class="ob-brand" href="/">
        <i class="bi bi-diagram-3-fill"></i>
        <span>Resource<strong>Planner</strong></span>
    </a>
    <div class="success-icon"><i class="bi bi-check-circle-fill"></i></div>
    <h1 class="ob-title">Demand Submitted!</h1>
    <p class="ob-body">
        Your project demand for <span class="ob-project">{{ project_name }}</span> has been received.<br />
        A confirmation email has been sent to <strong>{{ requester_email }}</strong>.<br /><br />
        Our team will review your request and get back to you soon.
    </p>
    <a href="/onboarding/" class="btn btn-primary px-4">
        <i class="bi bi-plus me-1"></i>Submit another demand
    </a>
    <div class="mt-3">
        <a href="/login/" class="btn btn-link text-secondary text-decoration-none">
            <i class="bi bi-box-arrow-in-right me-1"></i>Sign in to ResourcePlanner
        </a>
    </div>
</div>
</div>
</body>
</html>
